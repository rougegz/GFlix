name: GFlix Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write local properties
        run: |
          touch local.properties
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> local.properties
          echo "RABBITSTREAM_SOURCE_API=${{ secrets.RABBITSTREAM_SOURCE_API }}" >> local.properties
          chmod +x ./gradlew
          mkdir -p /tmp/gflix-apks

      - name: Build universal APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage universal APK
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" "/tmp/gflix-apks/GFlix-${{ github.ref_name }}.apk"

      - name: Build mobile APK
        run: |
          echo "APP_LAYOUT=mobile" >> local.properties
          ./gradlew assembleRelease --stacktrace
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" "/tmp/gflix-apks/GFlix-${{ github.ref_name }}-only-mobile.apk"

      - name: Build TV APK
        run: |
          echo "APP_LAYOUT=tv" >> local.properties
          ./gradlew assembleRelease --stacktrace
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" "/tmp/gflix-apks/GFlix-${{ github.ref_name }}-only-tv.apk"
          ls -la /tmp/gflix-apks/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/gflix-apks/*.apk
          generate_release_notes: true
